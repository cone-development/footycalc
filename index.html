<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1c14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FootyCalc">
<title>FootyCalc — League Calculator</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark">FootyCalc</span>
      <span class="sub">League Table Engine</span>
    </div>
    <div class="league-tabs" id="league-tabs"></div>
    <div class="season-row" id="season-row"></div>
  </div>
  <div id="screen-body"></div>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<div id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW failed', err));
  });
}
</script>
</body>
</html>
